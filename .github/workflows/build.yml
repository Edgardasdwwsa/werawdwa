name: Build jar
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - name: Build
        run: |
          set +e
          gradle build --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -E "error:|What went wrong|Could not|not found|Execution failed|symbol:|location:" -A3 build.log | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Gradle build failed::$msg"
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: placebreak-jar
          path: build/libs/*.jar
